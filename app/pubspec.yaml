name: homeplay
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  background_downloader: ^9.6.3
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path_provider: ^2.1.6
  photo_manager: ^3.12.0
  screen_brightness: ^2.1.11
  shared_preferences: ^2.5.5
  volume_controller: ^3.7.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Roboto (Apache 2.0) for libass: on Android it cannot see system fonts.
    - assets/fonts/roboto-regular.ttf
