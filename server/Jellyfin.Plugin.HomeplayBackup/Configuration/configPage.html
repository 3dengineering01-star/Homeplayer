<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Homeplay Backup</title>
</head>
<body>
    <div id="HomeplayBackupConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button">
        <div data-role="content">
            <div class="content-primary">
                <form id="HomeplayBackupConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="BackupFolder">Backup folder</label>
                        <input id="BackupFolder" name="BackupFolder" type="text" is="emby-input" />
                        <div class="fieldDescription">
                            Photos and videos from the Homeplay app go here, as User\Phone\Year\Month.
                            Add this folder to a Photos library to see them in Jellyfin.
                        </div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var HomeplayBackupConfig = {
                pluginUniqueId: 'ca1d038a-d3f7-4ef4-9839-1e93a8105618'
            };

            document.querySelector('#HomeplayBackupConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(HomeplayBackupConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#BackupFolder').value = config.BackupFolder || '';
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#HomeplayBackupConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(HomeplayBackupConfig.pluginUniqueId).then(function (config) {
                        config.BackupFolder = document.querySelector('#BackupFolder').value.trim();
                        ApiClient.updatePluginConfiguration(HomeplayBackupConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
